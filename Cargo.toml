[package]
name = "respawn99"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.9", features = [
    "runtime-tokio",
    "postgres",
    "macros",
    "migrate",
    "chrono",
    "uuid",
] }
tower-http = { version = "0.7.0", features = ["fs", "cors"] }
dotenvy = "0.15"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
argon2 = "0.5"
rand_core = { version = "0.6", features = ["getrandom"] }
jsonwebtoken = { version = "11", default-features = false, features = [
    "rust_crypto",
] }
serde = { version = "1", features = ["derive"] }
anyhow = "1"


[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
